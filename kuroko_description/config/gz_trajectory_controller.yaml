controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 200

joint_trajectory_controller:
  ros__parameters:
    joints:
      - chest
      - shoulder_r_pitch
      - shoulder_r_roll
      - elbow_r_front
      - elbow_r_rear
      - shoulder_l_pitch
      - shoulder_l_roll
      - elbow_l_front
      - elbow_l_rear
      - hip_r_roll
      - hip_r_pitch
      - shin_r_active
      - thigh_r_active
      - ankle_r_roll
      - ankle_r_yaw
      - hip_l_roll
      - hip_l_pitch
      - shin_l_active
      - thigh_l_active
      - ankle_l_roll
      - ankle_l_yaw

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 200.0
    action_monitor_rate: 200.0

    allow_partial_joints_goal: true
    interpolate_from_desired_state: false
    allow_integration_in_goal_trajectories: false
    set_last_command_interface_value_as_state_on_activation: true
    allow_nonzero_velocity_at_trajectory_end: true
    cmd_timeout: 10000.0
    stop_trajectory_duration: 10000.0
    open_loop_control: true

    constraints:
      stopped_velocity_tolerance: 1.0
      goal_time: 0.0

    gains:
      #body
      chest:
        p: 16.62
        i: 0.0
        d: 0.0
      #arm right
      shoulder_r_pitch:
        p: 16.62
        i: 0.0
        d: 0.0
      shoulder_r_roll:
        p: 42.41
        i: 0.0
        d: 0.0
      elbow_r_front:
        p: 16.62
        i: 0.0
        d: 0.0
      elbow_r_rear:
        p: 16.62
        i: 0.0
        d: 0.0
      #arm left
      shoulder_l_pitch:
        p: 16.62
        i: 0.0
        d: 0.0
      shoulder_l_roll:
        p: 42.41
        i: 0.0
        d: 0.0
      elbow_l_front:
        p: 16.62
        i: 0.0
        d: 0.0
      elbow_l_rear:
        p: 16.62
        i: 0.0
        d: 0.0
      #Leg right
      hip_r_roll:
        p: 16.62
        i: 0.0
        d: 0.0
      hip_r_pitch:
        p: 16.62
        i: 0.0
        d: 0.0
      thigh_r_active:
        p: 42.41
        i: 0.0
        d: 0.0
      shin_r_active:
        p: 42.41
        i: 0.0
        d: 0.0
      ankle_r_roll:
