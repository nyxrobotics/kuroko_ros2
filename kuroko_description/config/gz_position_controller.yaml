controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 200

joint_group_position_controller:
  ros__parameters:
    joints:
      - chest
      - shoulder_r_pitch
      - shoulder_r_roll
      - elbow_r_front
      - elbow_r_rear
      - shoulder_l_pitch
      - shoulder_l_roll
      - elbow_l_front
      - elbow_l_rear
      - hip_r_roll
      - hip_r_pitch
      - shin_r_active
      - thigh_r_active
      - ankle_r_roll
      - ankle_r_yaw
      - hip_l_roll
      - hip_l_pitch
      - shin_l_active
      - thigh_l_active
      - ankle_l_roll
      - ankle_l_yaw

    interface_name: position
