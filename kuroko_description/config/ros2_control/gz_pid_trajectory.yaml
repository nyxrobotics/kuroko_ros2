controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

joint_trajectory_controller:
  ros__parameters:
    use_sim_time: true

    joints:
      - chest
      - shoulder_r_pitch
      - shoulder_r_roll
      - elbow_r_front
      - elbow_r_rear
      - shoulder_l_pitch
      - shoulder_l_roll
      - elbow_l_front
      - elbow_l_rear
      - hip_r_roll
      - hip_r_pitch
      - thigh_r_active
      - shin_r_active
      - ankle_r_roll
      - ankle_r_yaw
      - hip_l_roll
      - hip_l_pitch
      - thigh_l_active
      - shin_l_active
      - ankle_l_roll
      - ankle_l_yaw

    # IMPORTANT:
    # Effort command makes the controller map tracking errors to effort via PID
    command_interfaces:
      - effort

    # Need both for tracking error computation (position+velocity)
    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true
    interpolate_from_desired_state: true
    allow_integration_in_goal_trajectories: true
    set_last_command_interface_value_as_state_on_activation: true
    action_monitor_rate: 100.0
    allow_nonzero_velocity_at_trajectory_end: true
    cmd_timeout: 1.0
    stop_trajectory_duration: 0.1
    state_publish_rate: 100.0
    open_loop_control: true

    # Trajectory/goal tolerances (tune as needed)
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      chest: {trajectory: 0.2, goal: 0.05}
      shoulder_r_pitch: {trajectory: 0.2, goal: 0.05}
      shoulder_r_roll: {trajectory: 0.2, goal: 0.05}
      elbow_r_front: {trajectory: 0.2, goal: 0.05}
      elbow_r_rear: {trajectory: 0.2, goal: 0.05}
      shoulder_l_pitch: {trajectory: 0.2, goal: 0.05}
      shoulder_l_roll: {trajectory: 0.2, goal: 0.05}
      elbow_l_front: {trajectory: 0.2, goal: 0.05}
      elbow_l_rear: {trajectory: 0.2, goal: 0.05}
      hip_r_roll: {trajectory: 0.2, goal: 0.05}
      hip_r_pitch: {trajectory: 0.2, goal: 0.05}
      thigh_r_active: {trajectory: 0.2, goal: 0.05}
      shin_r_active: {trajectory: 0.2, goal: 0.05}
      ankle_r_roll: {trajectory: 0.2, goal: 0.05}
      ankle_r_yaw: {trajectory: 0.2, goal: 0.05}
      hip_l_roll: {trajectory: 0.2, goal: 0.05}
      hip_l_pitch: {trajectory: 0.2, goal: 0.05}
      thigh_l_active: {trajectory: 0.2, goal: 0.05}
      shin_l_active: {trajectory: 0.2, goal: 0.05}
      ankle_l_roll: {trajectory: 0.2, goal: 0.05}
      ankle_l_yaw: {trajectory: 0.2, goal: 0.05}

    # PID gains for internal error->effort mapping (start from your Gazebo-era values)
    # Note: Some builds of JTC may ignore i_clamp/antiwindup; P/D are the most portable.
    gains:
      chest:            {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      shoulder_r_pitch: {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      shoulder_r_roll:  {p: 42.41, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      elbow_r_front:    {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      elbow_r_rear:     {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      shoulder_l_pitch: {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      shoulder_l_roll:  {p: 42.41, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      elbow_l_front:    {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      elbow_l_rear:     {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      hip_r_roll:       {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      hip_r_pitch:      {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      thigh_r_active:   {p: 42.41, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      shin_r_active:    {p: 42.41, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      ankle_r_roll:     {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      ankle_r_yaw:      {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      hip_l_roll:       {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      hip_l_pitch:      {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      thigh_l_active:   {p: 42.41, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      shin_l_active:    {p: 42.41, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      ankle_l_roll:     {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
      ankle_l_yaw:      {p: 16.62, i: 0.0, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true}
