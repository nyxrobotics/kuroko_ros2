controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_effort_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - chest
      - shoulder_r_pitch
      - shoulder_r_roll
      - elbow_r_front
      - elbow_r_rear
      - shoulder_l_pitch
      - shoulder_l_roll
      - elbow_l_front
      - elbow_l_rear
      - hip_r_roll
      - hip_r_pitch
      - thigh_r_active
      - shin_r_active
      - ankle_r_roll
      - ankle_r_yaw
      - hip_l_roll
      - hip_l_pitch
      - thigh_l_active
      - shin_l_active
      - ankle_l_roll
      - ankle_l_yaw

joint_trajectory_effort_controller:
  ros__parameters:
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    joints:
      - chest
      - shoulder_r_pitch
      - shoulder_r_roll
      - elbow_r_front
      - elbow_r_rear
      - shoulder_l_pitch
      - shoulder_l_roll
      - elbow_l_front
      - elbow_l_rear
      - hip_r_roll
      - hip_r_pitch
      - thigh_r_active
      - shin_r_active
      - ankle_r_roll
      - ankle_r_yaw
      - hip_l_roll
      - hip_l_pitch
      - thigh_l_active
      - shin_l_active
      - ankle_l_roll
      - ankle_l_yaw
    allow_partial_joints_goal: true
    interpolate_from_desired_state: true
    allow_integration_in_goal_trajectories: true
    set_last_command_interface_value_as_state_on_activation: true
    action_monitor_rate: 100
    allow_nonzero_velocity_at_trajectory_end: true
    cmd_timeout: 1.0
    stop_trajectory_duration: 0.1
    state_publish_rate: 100
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 1000.0
      goal_time: 0.1

    gains:
      chest:
        p: 16.62
        i: 0.0
        d: 0.0
      shoulder_r_pitch:
        p: 16.62
        i: 0.0
        d: 0.0
      shoulder_r_roll:
