isaac_policy_player:
  ros__parameters:
    # ------------------------------------------------------------
    # Time / ROS basics
    # ------------------------------------------------------------
    use_sim_time: true

    # ------------------------------------------------------------
    # Policy selection
    # ------------------------------------------------------------
    # Name under:
    #   <pkg_share>/trained_data/<policy_name>/
    policy_name: "kuroko_walk"

    # Optional explicit overrides (usually leave empty)
    policy_dir: ""        # default: <pkg_share>/trained_data/<policy_name>
    policy_path: ""       # if set, overrides everything (absolute or relative)
    model_path: ""        # legacy alias; leave empty

    # ------------------------------------------------------------
    # YAML paths
    # ------------------------------------------------------------
    # If empty:
    #   env_yaml_path = <policy_dir>/params/env.yaml
    env_yaml_path: ""

    # If empty:
    #   kuroko_description/config/ros2_control/joint_group_position_controller.yaml
    controller_yaml_path: ""

    # ------------------------------------------------------------
    # Execution / timing
    # ------------------------------------------------------------
    publish_hz: 100.0          # strongly recommended: 50 or 100 (NOT 200 initially)
    use_inference_thread: true

    # ------------------------------------------------------------
    # Startup behavior
    # ------------------------------------------------------------
    startup_move_to_default: true
    startup_move_duration_sec: 1.0
    startup_ramp_sec: 2.0

    # ------------------------------------------------------------
    # Action post-processing
    # ------------------------------------------------------------
    action_clip_abs: 1.0       # safety clip on raw policy output
    target_rate_limit: 6.0     # rad/s, additional smoothing

    # ------------------------------------------------------------
    # Joint velocity handling
    # ------------------------------------------------------------
    # auto | estimate | message
    joint_velocity_source: "estimate"
    dq_cutoff_hz: 30.0

    # ------------------------------------------------------------
    # Command input
    # ------------------------------------------------------------
    cmd_vel_timeout_sec: 1.0

    # ------------------------------------------------------------
    # Debug / logging
    # ------------------------------------------------------------
    startup_print: true
    debug_print: false
    debug_print_every: 50
    debug_print_joint_values: false
