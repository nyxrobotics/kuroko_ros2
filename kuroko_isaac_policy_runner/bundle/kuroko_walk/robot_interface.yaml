version: 1
frames:
  base_frame: body_link
sources:
  imu:
    msg_type: sensor_msgs/Imu
    topic: /kuroko/sensors/imu/data_madgwick
  joint_states:
    msg_type: sensor_msgs/JointState
    topic: /joint_states_velocity_overwritten
  cmd_vel:
    msg_type: geometry_msgs/Twist
    topic: /cmd_vel
term_inputs:
  base_ang_vel:
    source: imu
    data_field: angular_velocity
  generated_commands:
    source: cmd_vel
    data_field:
    - linear.x
    - linear.y
    - angular.z
  joint_pos_rel:
    source: joint_states
    name_field: name
    data_field: position
    rel: true
  joint_vel_rel:
    source: joint_states
    name_field: name
    data_field: velocity
    rel: true
  last_action:
    source: internal
  base_lin_acc_sens:
    source: imu
    data_field: linear_acceleration
control:
  type: forward_command_controller
  controller_name: /joint_group_position_controller
  controller_manager_name: /controller_manager
  command_topic: /joint_group_position_controller/commands
  command_msg_type: std_msgs/msg/Float64MultiArray
  rate_hz: 50
  rel: true
  command_joint_order: null
  command_joint_order_resolution:
    method: ros_param
    node: /joint_group_position_controller
    param: joints
  policy_joint_order_source: action_config.yaml
