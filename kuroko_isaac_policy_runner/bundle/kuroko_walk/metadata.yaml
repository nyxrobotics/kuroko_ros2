bundle_format_version: 1
created_at_utc: '2026-01-26T09:43:18.214121+00:00'
tool:
  name: isaac_policy_export
  entrypoint: isaac-export-bundle
robot_interface_version: v1
layout:
  exported_dir: exported/
  exported_artifacts:
  - policy.onnx
  - policy.pt
  - IO_descriptors.yaml
  runtime_abi_files:
  - io_descriptor.json
  - action_config.json
  - obs_normalization.json
runtime_assumptions:
  controller_joint_order_resolution:
    method: ros2_param_get
    controller_param: joints
    controller_node: /joint_group_position_controller
  joint_states_resolution:
    method: name_indexing
    note: Use sensor_msgs/JointState.name[] to align positions/velocities.
