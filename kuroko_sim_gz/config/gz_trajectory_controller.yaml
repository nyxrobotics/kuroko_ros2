# Controller parameters for gz_ros2_control + JointTrajectoryController (effort output)
#
# IMPORTANT:
# - Replace the 'joints' list with Kuroko's actual joint names.
# - This config assumes:
#     command_interfaces: [effort]
#     state_interfaces:   [position, velocity]
#
# Trajectory command: desired position (positions[] in the trajectory message)

controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - chest

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # Optional: tuning / safety
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    interpolate_from_desired_state: true

    # Effort limits (controller output clamp). Tune as needed.
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

    # PID gains for "position servo -> effort" behavior.
    # Tune p/i/d per joint.
    gains:
      chest:
        p: 200.0
        i: 0.0
        d: 10.0
        i_clamp_max: 2.0
        i_clamp_min: -2.0
        u_clamp_max: 50.0
        u_clamp_min: -50.0
        ff_velocity_scale: 0.0
